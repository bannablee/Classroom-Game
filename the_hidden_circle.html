<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#101522" />
<title>The Hidden Circle — Classroom Social Deduction</title>
<style>
:root{
  --bg:#0b101a;--panel:#141d2b;--panel2:#1a2637;--line:#2a3a50;--text:#f3f6fb;--muted:#a8b6c8;
  --gold:#f3c76a;--gold2:#ffe3a0;--red:#ff6f78;--blue:#72b7ff;--green:#6fdbad;--purple:#b69aff;
  --shadow:0 18px 50px rgba(0,0,0,.26);--radius:22px;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 12% -10%,rgba(89,117,164,.18),transparent 36%),radial-gradient(circle at 90% 4%,rgba(153,93,117,.11),transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}
.shell{max-width:1220px;margin:0 auto;padding:24px 22px 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand-mark{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#f4d28a,#c58a43);color:#25202a;font-size:24px;box-shadow:0 8px 25px rgba(227,175,91,.18)}
.brand-name{font-size:14px;letter-spacing:.16em;font-weight:900;color:var(--gold2)}
.brand-sub{font-size:12px;color:var(--muted);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px;white-space:nowrap;background:rgba(255,255,255,.025)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(111,219,173,.6)}
.hero{padding:34px 34px 30px;border:1px solid rgba(243,199,106,.21);border-radius:28px;background:linear-gradient(120deg,rgba(243,199,106,.10),transparent 43%),linear-gradient(145deg,#182335,#111a28 70%);box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:22px}
.hero:after{content:"";position:absolute;width:280px;height:280px;border:1px solid rgba(243,199,106,.12);border-radius:50%;right:-80px;top:-130px;box-shadow:0 0 0 28px rgba(243,199,106,.025),0 0 0 58px rgba(243,199,106,.02)}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
h1{font-size:clamp(34px,6vw,58px);line-height:1.02;letter-spacing:-.045em;margin:12px 0 12px;max-width:760px}
.hero p{color:#c0cad8;line-height:1.65;max-width:680px;margin:0;font-size:15px}
.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.75fr);gap:20px;align-items:start}
.panel{background:linear-gradient(180deg,rgba(25,37,54,.96),rgba(18,27,41,.98));border:1px solid var(--line);border-radius:var(--radius);padding:23px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:18px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:17px}
.panel h2{font-size:19px;margin:0;letter-spacing:-.02em}
.panel h3{font-size:14px;margin:0 0 8px}
.sub{font-size:13px;color:var(--muted);line-height:1.55;margin:6px 0 0}
.field-label{display:block;font-size:12px;font-weight:800;color:#dbe4ef;margin-bottom:8px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{background:#101a28;border:1px solid var(--line);padding:14px;border-radius:16px;text-align:left;color:var(--text);transition:.16s;min-height:120px}
.mode:hover{transform:translateY(-2px);border-color:#647b9c}
.mode.selected{border-color:var(--gold);background:linear-gradient(145deg,rgba(243,199,106,.13),rgba(16,26,40,.95));box-shadow:inset 0 0 0 1px rgba(243,199,106,.15)}
.mode-icon{font-size:22px;margin-bottom:9px}.mode strong{display:block;font-size:13px;margin-bottom:5px}.mode span{display:block;color:var(--muted);font-size:11px;line-height:1.45}
.section-gap{margin-top:22px}
.players-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.count{font-size:12px;color:var(--muted)}
.player-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.player-row{display:flex;align-items:center;gap:8px;background:#101a28;border:1px solid #27364b;border-radius:13px;padding:8px 9px;min-width:0}
.player-num{width:25px;height:25px;flex:0 0 25px;border-radius:9px;display:grid;place-items:center;background:#26364b;color:#c9d6e6;font-size:11px;font-weight:800}
.player-row input{min-width:0;width:100%;background:transparent;border:0;outline:0;color:var(--text);font-size:13px;padding:4px 0}
.icon-btn{width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:#8292a8;font-size:18px;display:grid;place-items:center}
.icon-btn:hover{background:#293649;color:#fff}
.add-row{display:flex;gap:9px;margin-top:11px;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:12px;padding:11px 15px;background:#1b2a3e;color:var(--text);font-weight:800;font-size:13px;transition:.16s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.btn.primary{background:linear-gradient(135deg,#f2d18b,#dca74d);border-color:#f5d58d;color:#29232a;box-shadow:0 8px 20px rgba(214,164,76,.15)}
.btn.danger{background:rgba(255,111,120,.1);border-color:rgba(255,111,120,.3);color:#ffabb0}
.btn.ghost{background:transparent}.btn.small{padding:8px 11px;font-size:12px;border-radius:10px}
.full{width:100%}
.control-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.07)}.control-row:last-child{border:0;padding-bottom:0}.control-row:first-child{padding-top:0}
.control-row strong{font-size:13px}.control-row small{display:block;color:var(--muted);font-size:11px;margin-top:3px;line-height:1.4}
select{border:1px solid var(--line);background:#101a28;color:var(--text);padding:9px 10px;border-radius:10px;outline:none;max-width:145px}
.switch{appearance:none;width:43px;height:24px;border-radius:99px;background:#34445a;position:relative;cursor:pointer;transition:.2s;flex:0 0 43px}.switch:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#dce4ee;transition:.2s}.switch:checked{background:#bd914c}.switch:checked:before{transform:translateX(19px);background:#fff4d6}
.role-preview{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:13px}.role-chip{background:#101a28;border:1px solid #27364b;padding:10px;border-radius:12px}.role-chip strong{display:block;font-size:17px;color:var(--gold2)}.role-chip span{font-size:11px;color:var(--muted)}
.info-box{background:rgba(114,183,255,.08);border:1px solid rgba(114,183,255,.2);border-radius:14px;padding:13px;color:#c6d8ed;font-size:12px;line-height:1.55}
.rules{display:grid;gap:11px}.rule{display:flex;gap:11px;align-items:flex-start}.rule-num{width:25px;height:25px;display:grid;place-items:center;border-radius:8px;background:#2a3b50;color:var(--gold2);font-size:11px;font-weight:900;flex:0 0 25px}.rule p{margin:1px 0 0;color:#c1ccda;font-size:12px;line-height:1.5}
.footer-note{text-align:center;color:#77879d;font-size:11px;margin-top:20px}
/* Role pass */
.private-wrap{max-width:760px;margin:55px auto 0}.private-alert{border:1px solid rgba(255,111,120,.35);background:rgba(255,111,120,.09);color:#ffb8bc;border-radius:13px;padding:12px 15px;font-size:12px;font-weight:800;letter-spacing:.04em;margin-bottom:15px;text-align:center}
.private-card{background:linear-gradient(145deg,#1b293d,#111a29);border:1px solid #3c4e67;border-radius:26px;padding:30px;text-align:center;box-shadow:var(--shadow)}.private-card h2{font-size:26px;margin:8px 0}.private-card p{color:var(--muted);line-height:1.55;font-size:14px}.pass-name{font-size:34px;font-weight:900;color:var(--gold2);margin:18px 0 22px;letter-spacing:-.04em}
.role-display{display:none;margin:22px auto 0;padding:24px;border:1px solid rgba(243,199,106,.38);background:rgba(243,199,106,.08);border-radius:20px;max-width:420px}.role-display.show{display:block}.role-emoji{font-size:38px}.role-display h3{font-size:25px;margin:7px 0;color:var(--gold2)}.role-display p{margin:0;color:#d2dce8}.ally-list{color:var(--gold2)!important;font-weight:800;margin-top:12px!important}
/* Game view */
.game-top{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:17px}.stat{padding:13px 14px;background:#111b2a;border:1px solid var(--line);border-radius:14px}.stat span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:900}.stat strong{display:block;font-size:21px;margin-top:4px}.phase-panel{min-height:430px;position:relative;overflow:hidden}.phase-kicker{color:var(--gold);text-transform:uppercase;letter-spacing:.18em;font-size:10px;font-weight:900}.phase-title{font-size:clamp(27px,4vw,39px);letter-spacing:-.04em;margin:9px 0}.phase-desc{font-size:14px;color:#c0ccda;line-height:1.65;max-width:700px}.phase-banner{padding:21px;border-radius:17px;background:linear-gradient(110deg,rgba(243,199,106,.13),rgba(243,199,106,.025));border:1px solid rgba(243,199,106,.19);margin:18px 0}.phase-banner strong{color:var(--gold2)}
.player-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:18px 0}.target-card{padding:12px 10px;border:1px solid #30425b;border-radius:13px;background:#111b29;color:var(--text);text-align:left;display:flex;align-items:center;gap:9px;min-width:0}.target-card:hover{border-color:#849bb9}.target-card.selected{border-color:var(--gold);background:rgba(243,199,106,.11);box-shadow:inset 0 0 0 1px rgba(243,199,106,.16)}.target-card:disabled{opacity:.35;cursor:not-allowed}.avatar{width:29px;height:29px;display:grid;place-items:center;border-radius:10px;background:#2a3c53;color:#e0e8f3;font-size:12px;font-weight:900;flex:0 0 29px}.target-card strong{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.target-card small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.action-bar{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.timer-box{margin:20px 0;padding:20px;background:#101a28;border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:space-between;gap:18px}.timer-number{font-size:44px;font-weight:900;letter-spacing:-.06em;font-variant-numeric:tabular-nums;color:var(--gold2)}.timer-track{height:7px;background:#2b394d;border-radius:99px;overflow:hidden;margin-top:10px}.timer-fill{height:100%;width:100%;background:linear-gradient(90deg,#eab85f,#f5d995);transition:width .5s linear}.timer-meta{min-width:0;flex:1}.timer-meta p{font-size:12px;color:var(--muted);margin:0}.timer-controls{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.roster{display:grid;gap:8px}.roster-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;background:#101a28;border:1px solid #26364a;border-radius:11px}.roster-row span{font-size:12px}.status{font-size:10px!important;font-weight:900;letter-spacing:.04em;color:var(--green)}.status.out{color:var(--red)}
.vote-box{background:#101a28;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:17px}.vote-progress{font-size:11px;color:var(--muted);margin-bottom:10px}.result-box{text-align:center;border:1px solid rgba(243,199,106,.25);background:linear-gradient(145deg,rgba(243,199,106,.1),rgba(17,26,41,.95));padding:25px;border-radius:19px;margin:20px 0}.result-box .big-icon{font-size:42px}.result-box h3{font-size:25px;margin:8px 0}.result-box p{color:#c0ccda;font-size:13px;line-height:1.55;margin:0}
.log-list{display:grid;gap:8px;max-height:270px;overflow:auto}.log-item{border-left:2px solid #526a86;padding:5px 0 5px 10px;color:#aebdce;font-size:11px;line-height:1.45}.log-item strong{color:#e7edf5}
.win-title{font-size:clamp(36px,6vw,60px);letter-spacing:-.05em;margin:10px 0;color:var(--gold2)}
.hidden{display:none!important}
@media(max-width:850px){.layout{grid-template-columns:1fr}.game-top{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.shell{padding:15px 12px 35px}.hero{padding:25px 21px}.panel{padding:18px}.modes{grid-template-columns:1fr}.mode{min-height:0;display:flex;gap:12px;align-items:center}.mode-icon{margin:0;font-size:24px}.player-list{grid-template-columns:1fr}.player-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.timer-box{align-items:flex-start;flex-direction:column}.timer-controls{justify-content:flex-start}.private-wrap{margin:22px auto}.private-card{padding:23px 16px}.topbar{align-items:flex-start}.pill{font-size:10px}.phase-panel{min-height:0}}
@media print{body{background:#fff;color:#111}.shell{max-width:none}.topbar,.hero,.footer-note{display:none}.panel{box-shadow:none;background:#fff;color:#111;border:1px solid #aaa}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">◈</div><div><div class="brand-name">THE HIDDEN CIRCLE</div><div class="brand-sub">A classroom social-deduction game</div></div></div>
    <div class="pill"><span class="dot"></span> OFFLINE PLAY · 5–25 PLAYERS</div>
  </header>
  <div id="app"></div>
  <div class="footer-note">Designed for face-to-face classroom play · One device is used by the moderator and players during private turns</div>
</div>
<script>
(() => {
  const $ = (s,root=document) => root.querySelector(s);
  const app = $('#app');
  const sampleNames = ['Alex','Jordan','Taylor','Sam','Riley','Morgan','Jamie','Casey','Avery','Cameron','Drew','Harper','Kai','Quinn','Reese','Rowan','Skyler','Parker','Emerson','Finley','Logan','Dakota','Sage','Blake','Charlie'];
  let nextId = 1;
  const makePlayer = name => ({id:nextId++, name, role:'Council', alive:true});
  const state = {
    screen:'setup', players:sampleNames.slice(0,8).map(makePlayer), style:'classic',
    detective:true, guardian:true, discussionSeconds:60, revealRoles:true,
    roleOrder:[], roleIndex:0, roleShowing:false,
    day:1, phase:'nightIntro', nightTarget:null, protectedTarget:null, detectiveTarget:null,
    selectedTarget:null, ballotOrder:[], ballotIndex:0, ballotChoice:null, votes:[], runoffCandidates:null, runoff:false,
    timerRemaining:60, timerRunning:false, log:[], winner:null, lastOut:null, lastNightOut:null
  };
  let timerHandle = null;

  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function alive(){return state.players.filter(p=>p.alive)}
  function findPlayer(id){return state.players.find(p=>p.id===Number(id))}
  function syndicateCount(){return alive().filter(p=>p.role==='Syndicate').length}
  function councilCount(){return alive().filter(p=>p.role!=='Syndicate').length}
  function roleCounts(){
    const n=state.players.length;
    const mafia=n<=7?1:n<=12?2:n<=18?3:4;
    return {syndicate:mafia, detective:state.detective?1:0, guardian:state.guardian?1:0, council:n-mafia-(state.detective?1:0)-(state.guardian?1:0)};
  }
  function styleName(){return ({classic:'Classic Council',quick:'Quick Game',expert:'Mastermind'})[state.style]}
  function addLog(text){state.log.unshift({day:state.day,text});}
  function stopTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null;}state.timerRunning=false;}
  function resetTimer(){stopTimer();state.timerRemaining=state.discussionSeconds;}
  function saveNames(){try{localStorage.setItem('hiddenCircleNames',JSON.stringify(state.players.map(p=>p.name)));}catch(e){}}
  function loadNames(){try{const saved=JSON.parse(localStorage.getItem('hiddenCircleNames')||'null');if(Array.isArray(saved)&&saved.length>=5){state.players=saved.slice(0,25).map(makePlayer);}}catch(e){}}
  loadNames();

  function renderSetup(){
    const c=roleCounts();
    const canStart=state.players.length>=5&&state.players.length<=25&&c.council>=2&&state.players.every(p=>p.name.trim());
    app.innerHTML=`
      <section class="hero"><div class="eyebrow">Secret roles · Big decisions · One winning team</div><h1>Trust is everything.<br>But someone is hiding.</h1><p>A hidden group is working against the Council. Work out who they are before they take control. Talk, question, bluff, investigate and vote — but choose carefully.</p></section>
      <div class="layout">
        <div>
          <section class="panel">
            <div class="panel-head"><div><h2>1. Choose your game style</h2><p class="sub">All styles use the same easy day-and-night rules.</p></div></div>
            <div class="modes">
              <button class="mode ${state.style==='classic'?'selected':''}" data-style="classic"><div class="mode-icon">🌙</div><div><strong>Classic Council</strong><span>Balanced first game. Roles are revealed when players leave.</span></div></button>
              <button class="mode ${state.style==='quick'?'selected':''}" data-style="quick"><div class="mode-icon">⚡</div><div><strong>Quick Game</strong><span>Short discussions and faster decisions.</span></div></button>
              <button class="mode ${state.style==='expert'?'selected':''}" data-style="expert"><div class="mode-icon">🎭</div><div><strong>Mastermind</strong><span>Hard mode. Secret roles stay hidden when players leave.</span></div></button>
            </div>
            <div class="section-gap players-head"><div><h2>2. Add your players</h2><p class="sub">Enter 5–25 names. Seven or more players is best for a balanced game.</p></div><span class="count" id="playerCount">${state.players.length}/25 players</span></div>
            <div class="player-list" id="playerList">${state.players.map((p,i)=>`<label class="player-row"><span class="player-num">${i+1}</span><input maxlength="24" aria-label="Player ${i+1} name" data-name-id="${p.id}" value="${esc(p.name)}"><button class="icon-btn" title="Remove player" data-remove="${p.id}" ${state.players.length<=5?'disabled':''}>×</button></label>`).join('')}</div>
            <div class="add-row"><button class="btn small" data-action="add-player" ${state.players.length>=25?'disabled':''}>＋ Add player</button><button class="btn small ghost" data-action="fill-25" ${state.players.length>=25?'disabled':''}>＋ Add sample names</button><button class="btn small ghost" data-action="shuffle-players">↻ Shuffle order</button></div>
            <div class="section-gap"><h2>3. Game settings</h2><p class="sub">Keep the standard settings for your first round, or adjust them.</p></div>
            <div class="control-row"><div><strong>Detective role</strong><small>Each night, privately checks one player’s team.</small></div><input class="switch" type="checkbox" data-setting="detective" ${state.detective?'checked':''}></div>
            <div class="control-row"><div><strong>Guardian role</strong><small>Each night, protects one player from being removed.</small></div><input class="switch" type="checkbox" data-setting="guardian" ${state.guardian?'checked':''}></div>
            <div class="control-row"><div><strong>Discussion time</strong><small>Time for the Council to talk before voting.</small></div><select data-setting="discussionSeconds"><option value="30" ${state.discussionSeconds===30?'selected':''}>30 seconds</option><option value="45" ${state.discussionSeconds===45?'selected':''}>45 seconds</option><option value="60" ${state.discussionSeconds===60?'selected':''}>1 minute</option><option value="90" ${state.discussionSeconds===90?'selected':''}>1 min 30 sec</option><option value="120" ${state.discussionSeconds===120?'selected':''}>2 minutes</option></select></div>
            <div class="control-row"><div><strong>Reveal roles when out</strong><small>Turn off for an extra challenge. Mastermind starts with this off.</small></div><input class="switch" type="checkbox" data-setting="revealRoles" ${state.revealRoles?'checked':''}></div>
            <div class="role-preview"><div class="role-chip"><strong>${c.syndicate}</strong><span>Syndicate members</span></div><div class="role-chip"><strong>${c.detective}</strong><span>Detective</span></div><div class="role-chip"><strong>${c.guardian}</strong><span>Guardian</span></div><div class="role-chip"><strong>${c.council}</strong><span>Council members</span></div></div>
            ${c.council<2?'<p class="sub" style="color:#ff9da4">There must be at least two Council members. Add players or turn off a special role.</p>':''}
            <div class="section-gap"><button class="btn primary full" data-action="start-game" ${canStart?'':'disabled'}>Assign secret roles & start game <span>→</span></button></div>
          </section>
        </div>
        <aside>
          <section class="panel"><div class="panel-head"><div><h2>How to play</h2><p class="sub">Five steps. Same pattern every round.</p></div><span class="pill">EASY RULES</span></div>
            <div class="rules">
              <div class="rule"><span class="rule-num">1</span><p><strong>Get a secret role.</strong> The Syndicate know each other. Everyone else must work out who is hiding.</p></div>
              <div class="rule"><span class="rule-num">2</span><p><strong>Night time.</strong> Everyone closes their eyes. The Syndicate choose one player. Special roles take their turns.</p></div>
              <div class="rule"><span class="rule-num">3</span><p><strong>Discuss.</strong> The group opens their eyes, shares ideas and decides who seems suspicious.</p></div>
              <div class="rule"><span class="rule-num">4</span><p><strong>Vote.</strong> Everyone secretly votes for one player to leave the Council.</p></div>
              <div class="rule"><span class="rule-num">5</span><p><strong>Find the winner.</strong> Council wins by finding every Syndicate member. Syndicate wins when they equal or outnumber the Council.</p></div>
            </div>
          </section>
          <section class="panel"><h2>Know the roles</h2><p class="sub">Only the person receiving the role card should read it.</p>
            <div class="control-row"><div><strong style="color:#ff929a">◆ Syndicate</strong><small>Choose one Council member to remove each night. Blend in during discussion.</small></div><span>🕶️</span></div>
            <div class="control-row"><div><strong style="color:#72b7ff">◈ Detective</strong><small>Check one player each night to learn whether they are Syndicate.</small></div><span>🔎</span></div>
            <div class="control-row"><div><strong style="color:#6fdbad">✚ Guardian</strong><small>Protect one player each night. A protected player cannot be removed by the Syndicate that night.</small></div><span>🛡️</span></div>
            <div class="control-row"><div><strong>○ Council</strong><small>Listen carefully, discuss, and vote out the Syndicate.</small></div><span>🗳️</span></div>
          </section>
          <div class="info-box">💡 <strong>Classroom tip:</strong> Use a teacher or non-playing moderator to run the game. Seven or more players is recommended. During role cards, investigations and secret ballots, do not show the device on the projector. Everyone else should look away or close their eyes.</div>
        </aside>
      </div>`;
  }

  function roleInfo(role){
    return {
      Syndicate:{icon:'🕶️',color:'#ff929a',desc:'You are part of the hidden team. At night, work with the other Syndicate members to choose one Council member to remove. During the day, act like a regular Council member.',goal:'Your team wins when Syndicate members equal or outnumber the Council.'},
      Detective:{icon:'🔎',color:'#72b7ff',desc:'Each night, privately choose one active player to investigate. You will learn whether they are part of the Syndicate. Use what you learn to guide the discussion without revealing too much.',goal:'Help the Council identify every Syndicate member.'},
      Guardian:{icon:'🛡️',color:'#6fdbad',desc:'Each night, choose one active player to protect. If the Syndicate choose that person, they stay in the game. You may protect yourself.',goal:'Keep the Council in the game and help find the Syndicate.'},
      Council:{icon:'○',color:'#e6edf7',desc:'You have no special night action. Listen to what everyone says, look for contradictions, share useful ideas and vote carefully.',goal:'Help the Council identify every Syndicate member.'}
    }[role];
  }
  function assignRoles(){
    const counts=roleCounts();
    const roles=[];
    for(let i=0;i<counts.syndicate;i++)roles.push('Syndicate');
    if(counts.detective)roles.push('Detective');
    if(counts.guardian)roles.push('Guardian');
    while(roles.length<state.players.length)roles.push('Council');
    for(let i=roles.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[roles[i],roles[j]]=[roles[j],roles[i]];}
    state.players.forEach((p,i)=>{p.role=roles[i];p.alive=true;});
    state.roleOrder=state.players.map(p=>p.id);state.roleIndex=0;state.roleShowing=false;
  }
  function startGame(){
    const names=state.players.map(p=>p.name.trim());
    if(names.some(n=>!n)){alert('Please enter a name for every player.');return;}
    if(new Set(names.map(n=>n.toLowerCase())).size!==names.length){if(!confirm('Some players have the same name. Continue anyway?'))return;}
    const c=roleCounts();if(state.players.length<5||c.council<2){alert('Please add at least 5 players and make sure there are at least 2 Council members.');return;}
    saveNames();assignRoles();stopTimer();state.screen='roles';state.day=1;state.phase='nightIntro';state.log=[];state.winner=null;state.lastOut=null;state.lastNightOut=null;state.nightTarget=null;state.protectedTarget=null;state.detectiveTarget=null;state.runoff=false;render();
  }
  function renderRoleReveal(){
    const p=findPlayer(state.roleOrder[state.roleIndex]);
    const r=p?roleInfo(p.role):null;
    const syndicate=state.players.filter(x=>x.role==='Syndicate'&&x.id!==p?.id).map(x=>x.name);
    app.innerHTML=`<div class="private-wrap"><div class="private-alert">🔒 PRIVATE SCREEN — DO NOT PROJECT OR LET OTHERS LOOK</div><div class="private-card">
      <div class="eyebrow">Secret role distribution · ${state.roleIndex+1} of ${state.roleOrder.length}</div>
      ${!state.roleShowing?`<div style="font-size:42px;margin:18px 0 5px">📩</div><h2>Pass the device to</h2><div class="pass-name">${esc(p.name)}</div><p>Everyone else, look away. When only this player can see the screen, they can reveal their role.</p><button class="btn primary full" data-action="show-role">I'm ${esc(p.name)} — reveal my role</button>`:`<div class="role-display show"><div class="role-emoji">${r.icon}</div><h3 style="color:${r.color}">${p.role==='Syndicate'?'SYNDICATE':p.role.toUpperCase()}</h3><p>${r.desc}</p>${p.role==='Syndicate'?`<p class="ally-list">Your team: ${syndicate.length?syndicate.map(esc).join(', '):'You are the only Syndicate member.'}</p>`:''}<p style="margin-top:13px"><strong>${r.goal}</strong></p></div><div class="action-bar" style="justify-content:center"><button class="btn primary full" data-action="hide-role">Hide role & pass device →</button></div>`}
    </div><p class="sub" style="text-align:center;margin-top:14px">Players: remember your role. Do not show or tell anyone your secret card unless you choose to during the game.</p></div>`;
  }

  function startNight(){
    stopTimer();state.phase='nightIntro';state.nightTarget=null;state.protectedTarget=null;state.detectiveTarget=null;state.selectedTarget=null;state.lastNightOut=null;render();
  }
  function nextAfterSyndicate(){
    const detective=alive().find(p=>p.role==='Detective');
    state.phase=detective?'detectiveIntro':(alive().some(p=>p.role==='Guardian')?'guardianIntro':'nightResolve');
    render();
  }
  function afterDetective(){
    state.phase=alive().some(p=>p.role==='Guardian')?'guardianIntro':'nightResolve';state.selectedTarget=null;render();
  }
  function resolveNight(){
    const target=findPlayer(state.nightTarget);
    if(target&&target.alive&&state.protectedTarget!==target.id){target.alive=false;state.lastNightOut=target;addLog(`${target.name} was removed from the Council during the night.`);}
    else if(target&&target.alive&&state.protectedTarget===target.id){state.lastNightOut=null;addLog('The Guardian protected the Syndicate target. No one left the Council tonight.');}
    else {state.lastNightOut=null;addLog('The night passed without anyone being removed.');}
    const win=checkWinner();if(win){state.winner=win;state.phase='gameOver';}else state.phase='nightResult';render();
  }
  function checkWinner(){
    const s=syndicateCount(),c=councilCount();
    if(s===0)return 'Council';
    if(s>=c)return 'Syndicate';
    return null;
  }
  function startDiscussion(){stopTimer();state.timerRemaining=state.discussionSeconds;state.phase='discussion';render();}
  function toggleTimer(){
    if(state.timerRunning){stopTimer();render();return;}
    if(state.timerRemaining<=0)state.timerRemaining=state.discussionSeconds;
    state.timerRunning=true;
    timerHandle=setInterval(()=>{
      state.timerRemaining=Math.max(0,state.timerRemaining-1);
      updateTimerDisplay();
      if(state.timerRemaining<=0){stopTimer();const stat=$('#timerStatus');if(stat)stat.textContent='Time is up — discuss no more. Move to the vote.';const control=$('[data-action="timer-toggle"]');if(control)control.textContent='↻ Restart timer';}
    },1000);
    render();
  }
  function updateTimerDisplay(){
    const n=$('#timerNumber'),f=$('#timerFill');if(!n||!f)return;
    const m=Math.floor(state.timerRemaining/60),s=state.timerRemaining%60;n.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    f.style.width=`${Math.max(0,state.timerRemaining/state.discussionSeconds*100)}%`;
  }
  function beginVoting(runoff=false,candidates=null){
    stopTimer();state.runoff=runoff;state.runoffCandidates=candidates;state.ballotOrder=alive().map(p=>p.id);state.ballotIndex=0;state.ballotChoice=null;state.votes=[];state.phase='voteIntro';render();
  }
  function resolveVotes(){
    const tally={};state.votes.forEach(v=>{tally[v.target]=(tally[v.target]||0)+1;});
    const max=Math.max(...Object.values(tally));const leaders=Object.keys(tally).filter(id=>tally[id]===max).map(Number);
    if(leaders.length>1&&!state.runoff){state.phase='runoffIntro';state.runoffCandidates=leaders;addLog('The vote was tied. A runoff vote will decide.');render();return;}
    if(leaders.length>1){state.lastOut=null;state.phase='tieResult';addLog('The runoff was still tied. No one was removed from the Council today.');render();return;}
    const out=findPlayer(leaders[0]);if(out&&out.alive){out.alive=false;state.lastOut=out;addLog(`${out.name} was voted out by the Council.`);}
    const win=checkWinner();if(win){state.winner=win;state.phase='gameOver';}else state.phase='voteResult';render();
  }
  function beginNextNight(){state.day++;startNight();}

  function targetCards(candidates,selected){
    return `<div class="player-grid">${candidates.map(p=>`<button class="target-card ${Number(selected)===p.id?'selected':''}" data-target="${p.id}"><span class="avatar">${esc(p.name.slice(0,1).toUpperCase())}</span><span style="min-width:0"><strong>${esc(p.name)}</strong><small>Choose player</small></span></button>`).join('')}</div>`;
  }
  function gameStats(){return `<div class="game-top"><div class="stat"><span>Game style</span><strong style="font-size:15px">${styleName()}</strong></div><div class="stat"><span>Day</span><strong>${state.day}</strong></div><div class="stat"><span>Still playing</span><strong>${alive().length}/${state.players.length}</strong></div><div class="stat"><span>Out of game</span><strong>${state.players.length-alive().length}</strong></div></div>`;}
  function rosterHTML(){return `<div class="roster">${state.players.map(p=>`<div class="roster-row"><span>${esc(p.name)}</span><span class="status ${p.alive?'':'out'}">${p.alive?'IN THE GAME':'OUT'}</span></div>`).join('')}</div>`;}
  function gameLayout(content){
    app.innerHTML=`${gameStats()}<div class="layout"><section class="panel phase-panel">${content}</section><aside><section class="panel"><div class="panel-head"><div><h2>Players</h2><p class="sub">Roles stay secret. This list only shows who is still playing.</p></div><span class="pill">${alive().length} ACTIVE</span></div>${rosterHTML()}</section><section class="panel"><div class="panel-head"><div><h2>Game log</h2><p class="sub">Public events from the game so far.</p></div></div><div class="log-list">${state.log.length?state.log.map(x=>`<div class="log-item"><strong>Day ${x.day} · </strong>${esc(x.text)}</div>`).join(''):'<div class="sub">No events yet. The first night is about to begin.</div>'}</div></section><button class="btn ghost full" style="margin-top:14px" data-action="back-setup">↺ Leave game / return to setup</button></aside></div>`;
  }
  function phaseHTML(){
    const active=alive();
    switch(state.phase){
      case 'nightIntro':return `<div class="phase-kicker">Night ${state.day} · Everyone close your eyes</div><h2 class="phase-title">The Council goes quiet.</h2><p class="phase-desc">Everyone should close their eyes and stay silent. The moderator will guide the secret roles one at a time. Do not peek at another player's private turn.</p><div class="phase-banner">🌙 <strong>Moderator:</strong> Make sure everyone has their eyes closed. Start the night when the room is quiet.</div><div class="action-bar"><button class="btn primary" data-action="begin-syndicate">Begin night actions →</button></div>`;
      case 'syndicate':{
        const candidates=active.filter(p=>p.role!=='Syndicate');
        return `<div class="phase-kicker">Night ${state.day} · Secret turn 1</div><h2 class="phase-title">🕶️ The Syndicate chooses</h2><p class="phase-desc">Syndicate members, open your eyes. Silently agree on one active Council member to remove. Everyone else keeps their eyes closed. Moderator, record the agreed choice below.</p>${targetCards(candidates,state.nightTarget)}<div class="action-bar"><button class="btn primary" data-action="lock-syndicate" ${state.nightTarget?'':'disabled'}>Lock choice & continue →</button></div>`;
      }
      case 'detectiveIntro':return `<div class="phase-kicker">Night ${state.day} · Secret turn 2</div><h2 class="phase-title">🔎 Detective, wake up.</h2><p class="phase-desc">Everyone else, keep your eyes closed. Pass the device to the Detective. They will privately choose one active player and see whether that person belongs to the Syndicate.</p><div class="private-alert" style="margin-top:20px">PRIVATE ACTION — ONLY THE DETECTIVE SHOULD SEE THE NEXT SCREEN</div><button class="btn primary" data-action="detective-open">I'm the Detective — continue</button>`;
      case 'detectiveSelect':{
        const candidates=active.filter(p=>p.role!=='Detective');
        return `<div class="phase-kicker">Private detective check</div><h2 class="phase-title">Choose someone to investigate.</h2><p class="phase-desc">Tap one active player. The result will appear privately on this device.</p><div class="private-alert">🔒 KEEP THIS SCREEN HIDDEN FROM EVERYONE ELSE</div>${targetCards(candidates,state.selectedTarget)}<button class="btn primary" data-action="detective-check" ${state.selectedTarget?'':'disabled'}>Check player</button>`;
      }
      case 'detectiveResult':{
        const p=findPlayer(state.detectiveTarget);const yes=p?.role==='Syndicate';
        return `<div class="phase-kicker">Private detective result</div><h2 class="phase-title">Investigation complete.</h2><div class="private-alert">🔒 ONLY THE DETECTIVE SHOULD READ THIS</div><div class="result-box"><div class="big-icon">${yes?'⚠️':'✅'}</div><h3>${esc(p?.name||'Unknown')}</h3><p>${yes?'This player IS a member of the Syndicate.':'This player is NOT a member of the Syndicate.'}</p></div><p class="phase-desc">Remember the result. Do not show the screen. When ready, hide this result and pass the device back to the moderator.</p><button class="btn primary" data-action="detective-done">Hide result & continue →</button>`;
      }
      case 'guardianIntro':return `<div class="phase-kicker">Night ${state.day} · Secret turn 3</div><h2 class="phase-title">🛡️ Guardian, wake up.</h2><p class="phase-desc">Everyone else, keep your eyes closed. The Guardian privately chooses one active player to protect tonight. The Guardian may protect themselves.</p><div class="private-alert" style="margin-top:20px">PRIVATE ACTION — ONLY THE GUARDIAN SHOULD SEE THE NEXT SCREEN</div><button class="btn primary" data-action="guardian-open">I'm the Guardian — continue</button>`;
      case 'guardianSelect':return `<div class="phase-kicker">Private guardian choice</div><h2 class="phase-title">Who will you protect?</h2><p class="phase-desc">Choose one active player. If the Syndicate selected the same person, that player will stay in the game.</p><div class="private-alert">🔒 KEEP THIS SCREEN HIDDEN FROM EVERYONE ELSE</div>${targetCards(active,state.selectedTarget)}<button class="btn primary" data-action="guardian-lock" ${state.selectedTarget?'':'disabled'}>Lock protection & finish night</button>`;
      case 'nightResolve':return `<div class="phase-kicker">Night ${state.day} · Moderator</div><h2 class="phase-title">The night is ending.</h2><p class="phase-desc">All secret choices are complete. Ask everyone to keep their eyes closed while the moderator resolves the night.</p><div class="phase-banner">The Syndicate chose a target. The Guardian may have protected that player.</div><button class="btn primary" data-action="resolve-night">Reveal the morning →</button>`;
      case 'nightResult':{
        const p=state.lastNightOut;
        return `<div class="phase-kicker">Day ${state.day} · Morning</div><h2 class="phase-title">The Council wakes up.</h2><div class="result-box"><div class="big-icon">${p?'🌘':'🛡️'}</div><h3>${p?`${esc(p.name)} is out of the game.`:'No one was removed last night.'}</h3><p>${p?(state.revealRoles?`Their secret role was ${p.role}.`:'Their secret role remains hidden.'):'The Guardian successfully protected the Syndicate’s target — or no target was selected.'}</p></div><p class="phase-desc">Everyone can open their eyes. The group may now discuss what happened and who they suspect.</p><button class="btn primary" data-action="start-discussion">Start the discussion →</button>`;
      }
      case 'discussion':return `<div class="phase-kicker">Day ${state.day} · Open discussion</div><h2 class="phase-title">Talk it out. Find the truth.</h2><p class="phase-desc">Everyone still in the game can speak. Share suspicions, explain your reasoning and listen for contradictions. The moderator controls the timer.</p><div class="timer-box"><div class="timer-meta"><p id="timerStatus">${state.timerRunning?'Discussion timer is running.':state.timerRemaining===0?'Time is up — move to the vote.':'Start the timer when everyone is ready.'}</p><div class="timer-number" id="timerNumber">${String(Math.floor(state.timerRemaining/60)).padStart(2,'0')}:${String(state.timerRemaining%60).padStart(2,'0')}</div><div class="timer-track"><div class="timer-fill" id="timerFill" style="width:${state.timerRemaining/state.discussionSeconds*100}%"></div></div></div><div class="timer-controls"><button class="btn small" data-action="timer-toggle">${state.timerRunning?'Ⅱ Pause':state.timerRemaining===0?'↻ Restart timer':'▶ Start timer'}</button><button class="btn small ghost" data-action="timer-reset">Reset</button></div></div><div class="phase-banner">🗣️ <strong>Discussion tip:</strong> Ask players to explain why they trust someone — or why they do not. Guessing without reasons is less useful.</div><button class="btn primary" data-action="go-vote">Time to vote →</button>`;
      case 'voteIntro':return `<div class="phase-kicker">Day ${state.day} · ${state.runoff?'Runoff vote':'Secret vote'}</div><h2 class="phase-title">The Council must decide.</h2><p class="phase-desc">Every active player gets one private vote. Pass the device to each voter in turn. Players choose one person they believe is part of the Syndicate. No one may vote for themselves.</p><div class="phase-banner">🗳️ The votes stay secret until everyone has voted. The player with the most votes leaves the Council.</div><button class="btn primary" data-action="start-ballots">Start secret voting →</button>`;
      case 'runoffIntro':return `<div class="phase-kicker">Day ${state.day} · Runoff vote</div><h2 class="phase-title">It's a tie!</h2><p class="phase-desc">The top players received the same number of votes. Everyone gets one more secret vote, but this time you can only choose between the tied players.</p><div class="phase-banner">A runoff settles the tie. If the runoff is also tied, nobody is voted out today.</div><button class="btn primary" data-action="start-runoff">Start runoff →</button>`;
      case 'ballotReady':{
        const voter=findPlayer(state.ballotOrder[state.ballotIndex]);
        return `<div class="phase-kicker">${state.runoff?'Runoff':'Secret'} ballot · ${state.ballotIndex+1} of ${state.ballotOrder.length}</div><h2 class="phase-title">Pass the device to</h2><div class="pass-name">${esc(voter?.name||'Next voter')}</div><p class="phase-desc">Everyone else, look away. The voter should open their ballot privately, make one choice and then hide the screen.</p><div class="private-alert">🔒 PRIVATE VOTE — DO NOT PROJECT</div><button class="btn primary" data-action="open-ballot">I'm ready to vote</button>`;
      }
      case 'ballotPick':{
        const voter=findPlayer(state.ballotOrder[state.ballotIndex]);
        const candidates=state.runoffCandidates?state.runoffCandidates.map(findPlayer).filter(p=>p&&p.alive):active;
        return `<div class="phase-kicker">Private ballot · ${state.ballotIndex+1} of ${state.ballotOrder.length}</div><h2 class="phase-title">Who do you vote for?</h2><p class="phase-desc">Your vote is private. Choose one player. You cannot vote for yourself (${esc(voter?.name)}).</p><div class="private-alert">🔒 ONLY ${esc(voter?.name||'THIS VOTER').toUpperCase()} SHOULD SEE THIS SCREEN</div>${targetCards(candidates.filter(p=>p.id!==voter?.id),state.ballotChoice)}<button class="btn primary" data-action="submit-ballot" ${state.ballotChoice?'':'disabled'}>Confirm my vote</button>`;
      }
      case 'voteResult':{
        const p=state.lastOut;
        return `<div class="phase-kicker">Day ${state.day} · Vote result</div><h2 class="phase-title">The Council has voted.</h2><div class="result-box"><div class="big-icon">🗳️</div><h3>${p?`${esc(p.name)} leaves the Council.`:'The vote is complete.'}</h3><p>${p?(state.revealRoles?`Their role was ${p.role}.`:'Their role stays secret.'):'No player was selected.'}</p></div><p class="phase-desc">Players who are out become observers. They must not give hints, vote or reveal secret information.</p><button class="btn primary" data-action="next-night">Continue to the next night →</button>`;
      }
      case 'tieResult':return `<div class="phase-kicker">Day ${state.day} · No decision</div><h2 class="phase-title">The Council is divided.</h2><div class="result-box"><div class="big-icon">⚖️</div><h3>No one leaves today.</h3><p>The runoff was tied as well. The Council must try again tomorrow.</p></div><button class="btn primary" data-action="next-night">Continue to the next night →</button>`;
      case 'gameOver':{
        const win=state.winner;const winnerText=win==='Council'?'THE COUNCIL WINS':'THE SYNDICATE WINS';
        return `<div class="phase-kicker">Game complete · Day ${state.day}</div><div style="text-align:center;padding:24px 5px"><div style="font-size:56px">${win==='Council'?'🏆':'🕶️'}</div><div class="win-title">${winnerText}</div><p class="phase-desc" style="margin:0 auto">${win==='Council'?'Every Syndicate member has been identified. The Council saved the day!':'The Syndicate now equals or outnumbers the remaining Council. They take control.'}</p></div><div class="result-box"><h3>Final roles</h3><div class="roster" style="text-align:left">${state.players.map(p=>`<div class="roster-row"><span>${esc(p.name)}</span><span class="status" style="color:${p.role==='Syndicate'?'#ff929a':p.role==='Detective'?'#72b7ff':p.role==='Guardian'?'#6fdbad':'#d7e0ec'}">${p.role.toUpperCase()}${p.alive?' · IN':' · OUT'}</span></div>`).join('')}</div></div><div class="action-bar"><button class="btn primary" data-action="play-again">Play again with same players ↻</button><button class="btn" data-action="back-setup">New setup</button></div>`;
      }
      default:return '<p>Game phase not found.</p>';
    }
  }
  function renderGame(){gameLayout(phaseHTML());}
  function render(){if(state.screen==='setup')renderSetup();else if(state.screen==='roles')renderRoleReveal();else renderGame();}

  function handleClick(e){
    const styleBtn=e.target.closest('[data-style]');if(styleBtn){state.style=styleBtn.dataset.style;if(state.style==='classic'){state.discussionSeconds=60;state.revealRoles=true;}if(state.style==='quick'){state.discussionSeconds=30;state.revealRoles=true;}if(state.style==='expert'){state.discussionSeconds=45;state.revealRoles=false;}render();return;}
    const rm=e.target.closest('[data-remove]');if(rm){if(state.players.length<=5)return;state.players=state.players.filter(p=>p.id!==Number(rm.dataset.remove));saveNames();render();return;}
    const target=e.target.closest('[data-target]');if(target){const id=Number(target.dataset.target);if(state.phase==='syndicate')state.nightTarget=id;else if(state.phase==='ballotPick')state.ballotChoice=id;else state.selectedTarget=id;render();return;}
    const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
    switch(action){
      case 'add-player':if(state.players.length<25){state.players.push(makePlayer(`Player ${state.players.length+1}`));saveNames();render();}break;
      case 'fill-25':while(state.players.length<25)state.players.push(makePlayer(sampleNames[state.players.length]||`Player ${state.players.length+1}`));saveNames();render();break;
      case 'shuffle-players':for(let i=state.players.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.players[i],state.players[j]]=[state.players[j],state.players[i]];}render();break;
      case 'start-game':startGame();break;
      case 'show-role':state.roleShowing=true;render();break;
      case 'hide-role':state.roleShowing=false;state.roleIndex++;if(state.roleIndex>=state.roleOrder.length){state.screen='game';state.phase='nightIntro';}render();break;
      case 'begin-syndicate':state.phase=alive().some(p=>p.role==='Syndicate')?'syndicate':(alive().some(p=>p.role==='Detective')?'detectiveIntro':(alive().some(p=>p.role==='Guardian')?'guardianIntro':'nightResolve'));state.selectedTarget=null;render();break;
      case 'lock-syndicate':if(!state.nightTarget){alert('Choose a target first.');break;}nextAfterSyndicate();break;
      case 'detective-open':state.phase='detectiveSelect';state.selectedTarget=null;render();break;
      case 'detective-check':if(!state.selectedTarget)break;state.detectiveTarget=state.selectedTarget;state.phase='detectiveResult';render();break;
      case 'detective-done':afterDetective();break;
      case 'guardian-open':state.phase='guardianSelect';state.selectedTarget=null;render();break;
      case 'guardian-lock':if(!state.selectedTarget)break;state.protectedTarget=state.selectedTarget;state.selectedTarget=null;state.phase='nightResolve';render();break;
      case 'resolve-night':resolveNight();break;
      case 'start-discussion':startDiscussion();break;
      case 'timer-toggle':toggleTimer();break;
      case 'timer-reset':resetTimer();render();break;
      case 'go-vote':beginVoting(false,null);break;
      case 'start-ballots':state.phase='ballotReady';state.ballotIndex=0;render();break;
      case 'start-runoff':beginVoting(true,state.runoffCandidates);state.phase='ballotReady';render();break;
      case 'open-ballot':state.phase='ballotPick';state.ballotChoice=null;render();break;
      case 'submit-ballot':if(!state.ballotChoice)break;state.votes.push({voter:state.ballotOrder[state.ballotIndex],target:state.ballotChoice});state.ballotIndex++;state.ballotChoice=null;if(state.ballotIndex>=state.ballotOrder.length)resolveVotes();else{state.phase='ballotReady';render();}break;
      case 'next-night':beginNextNight();break;
      case 'play-again':{
        const keep=state.players.map(p=>({id:p.id,name:p.name,role:'Council',alive:true}));state.players=keep;state.screen='setup';state.log=[];state.winner=null;render();break;
      }
      case 'back-setup':if(confirm('Leave this game and return to setup? The current game will end.')){stopTimer();state.screen='setup';state.players.forEach(p=>{p.alive=true;p.role='Council';});render();}break;
    }
  }
  app.addEventListener('click',handleClick);
  app.addEventListener('change',e=>{
    const el=e.target;
    if(el.dataset.nameId){const p=findPlayer(el.dataset.nameId);if(p){p.name=el.value.trim();saveNames();}const count=$('#playerCount');if(count)count.textContent=`${state.players.length}/25 players`;return;}
    if(el.dataset.setting){const key=el.dataset.setting;if(el.type==='checkbox')state[key]=el.checked;else state[key]=Number(el.value);if(key==='discussionSeconds')state.timerRemaining=state.discussionSeconds;render();}
  });
  app.addEventListener('input',e=>{const el=e.target;if(el.dataset.nameId){const p=findPlayer(el.dataset.nameId);if(p)p.name=el.value;}});
  render();
})();
</script>
</body>
</html>
